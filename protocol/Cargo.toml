[package]
name = "nui-protocol"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Generated cross-language contracts for Nexa UI hosts"
include = ["generated/protocol.rs"]

[lib]
path = "generated/protocol.rs"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
