[package]
name = "nexa-windows-static-closure"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.95"

[lib]
name = "nexa_windows_static_closure"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# ponytail: Preview apps need core, Host promises, and protocol regex validation; add features only when supported apps import them.
perry-stdlib = { git = "https://github.com/PerryTS/perry", rev = "06137858dc8c6f80975238377138f2f948d6ef88", version = "=0.5.1220", default-features = false, features = ["core", "async-runtime"] }
perry-runtime = { git = "https://github.com/PerryTS/perry", rev = "06137858dc8c6f80975238377138f2f948d6ef88", version = "=0.5.1220", default-features = false, features = ["stdlib", "regex-engine"] }
perry-ext-nui_host = { path = "../../packages/nui-host" }
perry-ext-nexa_system_host = { path = "../../packages/system-host" }

[profile.release]
# Keep dependency C ABI exports visible through the wrapper under Thin LTO.
codegen-units = 16
lto = "thin"
panic = "unwind"
strip = false

[workspace]
resolver = "2"
