name: Security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.2"
  GITLEAKS_LINUX_X64_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e

jobs:
  policy:
    name: Policy and npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/action-sha-policy.mjs
      - run: pnpm licenses list --json | node tools/license-policy.mjs
      - run: node tools/license-policy.mjs --self-test
      - run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org/
      - run: node --test tools/security-policy.test.mjs

  rust-audit:
    name: Rust audit (${{ matrix.lockfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - Cargo.lock
          - packages/nui-host/Cargo.lock
          - packages/system-host/Cargo.lock
          - tools/windows-static-closure/Cargo.lock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-09
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file "${{ matrix.lockfile }}" --deny warnings

  cargo-deny:
    name: Cargo deny (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - packages/nui-host/Cargo.toml
          - packages/system-host/Cargo.toml
          - tools/windows-static-closure/Cargo.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-09
        with:
          toolchain: stable
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked --manifest-path "${{ matrix.manifest }}" --config "$GITHUB_WORKSPACE/deny.toml" check advisories bans licenses sources

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary_directory="$RUNNER_TEMP/nexa-gitleaks-bin"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum --check -
          mkdir "$binary_directory"
          tar --extract --gzip --file "$archive" --directory "$binary_directory" gitleaks
          chmod 0755 "$binary_directory/gitleaks"
          echo "GITLEAKS_BIN=$binary_directory/gitleaks" >> "$GITHUB_ENV"
      - name: Prove the synthetic secret is rejected
        shell: bash
        run: |
          negative_root="$RUNNER_TEMP/nexa-security-negative"
          report="$RUNNER_TEMP/nexa-security-negative.json"
          mkdir "$negative_root"
          cp tools/fixtures/security/secret.txt "$negative_root/secret.txt"
          set +e
          "$GITLEAKS_BIN" dir "$negative_root" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --exit-code 42 \
            --no-banner \
            --no-color \
            --redact \
            --report-format json \
            --report-path "$report"
          negative_status=$?
          set -e
          if [[ "$negative_status" -ne 42 ]]; then
            echo "Synthetic secret rehearsal returned $negative_status instead of leak status 42" >&2
            exit 1
          fi
          test -s "$report"
      - name: Scan complete Git history
        shell: bash
        run: |
          "$GITLEAKS_BIN" git "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --log-opts="--all" \
            --no-banner \
            --no-color \
            --redact
      - name: Scan working tree
        shell: bash
        run: |
          "$GITLEAKS_BIN" dir "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner \
            --no-color \
            --redact
