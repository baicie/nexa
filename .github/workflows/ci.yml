name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      ffi: ${{ steps.filter.outputs.ffi }}
      docs: ${{ steps.filter.outputs.docs }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'examples/rust-counter/**'
              - 'packages/nui-host/Cargo.toml'
              - 'packages/nui-host/Cargo.lock'
              - 'packages/nui-host/src/**/*.rs'
              - 'packages/system-host/Cargo.toml'
              - 'packages/system-host/Cargo.lock'
              - 'packages/system-host/src/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'rustfmt.toml'
              - 'scripts/**'
              - '.github/workflows/rust.yml'
              - '.github/workflows/ci.yml'
            typescript:
              - 'packages/**'
              - 'examples/clipboard-demo/**'
              - 'examples/counter/**'
              - 'examples/image-demo/**'
              - 'examples/layout-playground/**'
              - 'examples/perry-counter/**'
              - 'examples/react-counter/**'
              - 'examples/solid-counter/**'
              - 'examples/svelte-counter/**'
              - 'examples/todo/**'
              - 'examples/vue-counter/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
              - '.npmrc'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'scripts/**'
              - 'tools/**'
              - '.github/workflows/typescript.yml'
              - '.github/workflows/ci.yml'
            ffi:
              - 'crates/**'
              - 'packages/nui-host/**'
              - 'packages/system-host/**'
              - 'packages/ui/**'
              - 'examples/counter/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.npmrc'
              - '.cargo/**'
              - 'scripts/**'
              - 'tools/perry-smoke.mjs'
              - '.github/workflows/ffi.yml'
              - '.github/workflows/ci.yml'
            native:
              - 'crates/nui-platform-winit/**'
              - 'crates/nui-render-skia/**'
              - 'examples/rust-counter/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/**'
              - '.github/workflows/native-smoke.yml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/docs.yml'
              - '.github/workflows/README.md'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    uses: ./.github/workflows/typescript.yml

  ffi:
    name: FFI
    needs: changes
    if: needs.changes.outputs.ffi == 'true'
    uses: ./.github/workflows/ffi.yml

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.rust != 'true' && needs.changes.outputs.typescript != 'true'
    uses: ./.github/workflows/docs.yml

  # Slice 0+ only: GPU/window smoke. Disabled as required until drawable window exists.
  # Enable by setting native_smoke_enabled to true after Slice 0 lands.
  native-smoke:
    name: Native smoke
    needs: changes
    if: needs.changes.outputs.native == 'true' && vars.NATIVE_SMOKE_ENABLED == 'true'
    uses: ./.github/workflows/native-smoke.yml

  result:
    name: result
    if: always()
    needs: [changes, rust, typescript, ffi, docs, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          TS: ${{ needs.typescript.result }}
          FFI: ${{ needs.ffi.result }}
          DOCS: ${{ needs.docs.result }}
          NATIVE: ${{ needs.native-smoke.result }}
          RUST_NEEDED: ${{ needs.changes.outputs.rust }}
          TS_NEEDED: ${{ needs.changes.outputs.typescript }}
          FFI_NEEDED: ${{ needs.changes.outputs.ffi }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$CHANGES" != "success" ]]; then
            echo "Change detection failed: $CHANGES"
            fail=1
          fi
          if [[ "$RUST_NEEDED" == "true" && "$RUST" != "success" ]]; then
            echo "Rust gate failed: $RUST"
            fail=1
          fi
          if [[ "$TS_NEEDED" == "true" && "$TS" != "success" ]]; then
            echo "TypeScript gate failed: $TS"
            fail=1
          fi
          if [[ "$FFI_NEEDED" == "true" && "$FFI" != "success" ]]; then
            echo "FFI gate failed: $FFI"
            fail=1
          fi
          # docs / native-smoke are advisory or opt-in; do not fail the aggregator on skip
          if [[ "$DOCS" == "failure" ]]; then
            echo "Docs gate failed"
            fail=1
          fi
          if [[ "$NATIVE" == "failure" ]]; then
            echo "Native smoke failed"
            fail=1
          fi
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "All required gates passed (or correctly skipped)."
