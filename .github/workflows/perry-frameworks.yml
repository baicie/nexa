name: Perry frameworks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: AOT (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        framework: [solid, solid-notes, vue, react, svelte]
        os: [macos-15, windows-2022]
    env:
      PERRY_NO_CACHE: "1"
      PERRY_NO_AUTO_OPTIMIZE: "1"
      NEXA_WINDOWS_RUNTIME_ROOT: ${{ github.workspace }}/.nexa-windows-runtime
      SKIA_WINDOWS_ARCHIVE_URL: https://github.com/rust-skia/skia-binaries/releases/download/0.99.0/skia-binaries-a25a0fdb7d90429aa2d1-x86_64-pc-windows-msvc-jpegd-jpege-pdf.tar.gz
      SKIA_WINDOWS_ARCHIVE_SHA256: 406865946e42aa7a3872f364981f031f615bf8f2e80fdccfc15f0d01bc144580
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out pinned Perry source
        if: runner.os == 'Windows'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PerryTS/perry
          ref: 06137858dc8c6f80975238377138f2f948d6ef88
          path: .perry-source
          persist-credentials: false

      - name: Install Perry-compatible Rust toolchain
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable 2026-08-09
        with:
          toolchain: 1.95.0

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Download verified Windows Skia archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "skia-bindings-windows-x64.tar.gz"
          curl.exe --location --fail --silent --show-error --retry 3 --output $archive $env:SKIA_WINDOWS_ARCHIVE_URL
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SKIA_WINDOWS_ARCHIVE_SHA256) {
            throw "Skia archive checksum mismatch: expected $env:SKIA_WINDOWS_ARCHIVE_SHA256, got $actual"
          }
          $fileUrl = "file://" + $archive.Replace('\', '/')
          "NEXA_WINDOWS_SKIA_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKIA_BINARIES_URL=$fileUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build clean workspace package artifacts
        run: pnpm release:build

      - name: Stage verified Windows Skia for Perry frameworks
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          node tools/stage-windows-skia.mjs
          --project "examples/reference-notes"
          --archive "$env:NEXA_WINDOWS_SKIA_ARCHIVE"
          --sha256 "$env:SKIA_WINDOWS_ARCHIVE_SHA256"

      - name: Build patched Perry compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
          PERRY_SOURCE_REVISION: 06137858dc8c6f80975238377138f2f948d6ef88
          PERRY_WORKSPACE_ROOT: ${{ github.workspace }}/.perry-source
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: |
          rustc --version
          $actualRevision = (git -C $env:PERRY_WORKSPACE_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the Perry source revision" }
          if ($actualRevision -ne $env:PERRY_SOURCE_REVISION) {
            throw "Perry source revision mismatch: expected $env:PERRY_SOURCE_REVISION, got $actualRevision"
          }

          $patch = Join-Path $env:GITHUB_WORKSPACE "patches/perry/0001-windows-reject-duplicate-symbols.patch"
          git -C $env:PERRY_WORKSPACE_ROOT apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "The Perry duplicate-symbol patch no longer applies cleanly" }
          git -C $env:PERRY_WORKSPACE_ROOT apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Could not apply the Perry duplicate-symbol patch" }
          $changedPaths = @(git -C $env:PERRY_WORKSPACE_ROOT diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the tracked Perry patch changes" }
          $untrackedPaths = @(git -C $env:PERRY_WORKSPACE_ROOT ls-files --others)
          if (
            $LASTEXITCODE -ne 0 -or
            $untrackedPaths.Count -ne 0 -or
            $changedPaths.Count -ne 1 -or
            $changedPaths[0] -ne "crates/perry/src/commands/compile/link/platform_cmd.rs"
          ) {
            throw "The Perry patch changed files outside the Windows linker command"
          }
          git -C $env:PERRY_WORKSPACE_ROOT apply --reverse --check $patch
          if ($LASTEXITCODE -ne 0) { throw "The applied Perry patch does not match the reviewed patch" }

          cargo build `
            --locked `
            --release `
            --manifest-path (Join-Path $env:PERRY_WORKSPACE_ROOT "Cargo.toml") `
            --target-dir (Join-Path $env:PERRY_WORKSPACE_ROOT "target") `
            -p perry
          if ($LASTEXITCODE -ne 0) { throw "Could not build the patched Perry compiler" }

          $compiler = (Resolve-Path -LiteralPath (Join-Path $env:PERRY_WORKSPACE_ROOT "target/release/perry.exe")).Path
          $nativeVersion = (& $compiler --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $nativeVersion -ne "perry 0.5.1220") {
            throw "Unexpected patched Perry version: $nativeVersion"
          }
          $npmVersion = (& pnpm exec perry --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -ne "perry 0.5.1220") {
            throw "Unexpected npm Perry version: $npmVersion"
          }
          Write-Host "Patched Perry: $nativeVersion; npm Perry: $npmVersion"
          "NEXA_PERRY_BIN=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          pnpm exec perry --version

      - name: Clean AOT build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm test:perry ${{ matrix.framework }}

      - name: Clean AOT build and audit linker output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "perry-framework-${{ matrix.framework }}.log"
          & pnpm test:perry ${{ matrix.framework }} 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "Perry framework build failed with exit code $LASTEXITCODE"
          }
          $forbidden = @(Select-String -Path $log -Pattern 'FORCE:MULTIPLE|LNK4006|LNK4088')
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Host $_.Line }
            throw "Windows AOT linker audit failed: forced or duplicate-symbol linking was observed"
          }
