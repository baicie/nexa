name: Native smoke

# Slice 0+: build/run drawable demo on MVP platforms only (macOS + Windows).
# Gated by repository variable NATIVE_SMOKE_ENABLED=true from ci.yml.

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}

      - name: Build rust-counter
        run: cargo build -p rust-counter --release

      # Headless CI cannot open a real window reliably.
      # Slice 0 should add a --smoke flag that draws one frame offscreen / exits 0.
      - name: Run scaffold / smoke
        run: cargo run -p rust-counter --release
        timeout-minutes: 2
