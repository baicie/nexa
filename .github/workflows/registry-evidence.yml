name: Registry evidence

# This workflow never publishes a package. Bootstrap evidence attests the
# revision-specific staging tag before final channel promotion; final evidence
# can independently attest the public channel after promotion.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Attest the revision staging tag or the promoted public channel"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - final

permissions:
  contents: read

jobs:
  registry:
    name: Verify public npm train from a fresh consumer
    runs-on: macos-15
    timeout-minutes: 60
    environment:
      name: technical-preview-registry-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Bind exact release tag and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/v0.1.0" ]]; then
            echo "Registry evidence requires refs/tags/v0.1.0, got $GITHUB_REF" >&2
            exit 64
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          node tools/release-readiness.mjs validate
          node tools/action-sha-policy.mjs
      - name: Install pinned evidence tooling
        run: pnpm install --frozen-lockfile
      - name: Run registry evidence contracts
        run: node --test tools/registry-evidence.test.mjs
      - name: Install and verify public nine-package train
        shell: bash
        run: |
          set -euo pipefail
          node tools/registry-evidence.mjs collect \
            --output "$RUNNER_TEMP/nexa-registry-evidence" \
            --revision "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --phase "${{ inputs.phase }}"
          node tools/registry-evidence.mjs verify \
            --evidence "$RUNNER_TEMP/nexa-registry-evidence/registry-evidence.json" \
            --revision "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --phase "${{ inputs.phase }}"
      - name: Upload revision-bound registry proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-evidence
          path: ${{ runner.temp }}/nexa-registry-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
