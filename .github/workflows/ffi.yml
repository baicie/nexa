name: FFI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [nui-host, system-host]
    env:
      FFI_MANIFEST: packages/${{ matrix.package }}/Cargo.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux native dependencies
        if: matrix.package == 'nui-host'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Activate pinned Rust toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ffi-${{ matrix.package }}
          workspaces: packages/${{ matrix.package }} -> target

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          pnpm exec perry --version

      - name: Format
        run: cargo fmt --manifest-path "$FFI_MANIFEST" -- --check

      - name: Check
        run: cargo check --manifest-path "$FFI_MANIFEST" --all-targets --locked

      - name: Clippy
        run: cargo clippy --manifest-path "$FFI_MANIFEST" --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path "$FFI_MANIFEST" --all-targets --locked

      - name: Validate Perry manifest
        working-directory: packages/${{ matrix.package }}
        run: pnpm exec perry native validate

      - name: Run Minimal TSX Perry smoke
        if: matrix.package == 'nui-host'
        run: pnpm --filter @nexa/example-counter smoke
