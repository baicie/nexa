[package]
name = "perry-ext-nexa_system_host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Perry native library: Nexa System Host (ADR-005)"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
nui-app-runtime = { path = "../../crates/nui-app-runtime" }
perry-ffi = { git = "https://github.com/PerryTS/perry", rev = "06137858dc8c6f80975238377138f2f948d6ef88", version = "0.5.1220" }
nui-system-core = { path = "../../crates/nui-system-core" }
rfd = "0.15.4"
serde_json = "1.0"
